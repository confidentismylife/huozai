[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-aware-fire-evac"
version = "0.6.0"
description = "Prototype environment for behavior-aware RL fire evacuation guidance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.8", "sb3-contrib>=2.9"]
dev = ["pytest>=8", "ruff>=0.9"]
data = ["xlrd>=2.0", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

